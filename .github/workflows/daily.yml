name: daily update

# 毎朝 JST 6:00（UTC 21:00）に自動実行。手動実行も可能。
on:
  schedule:
    - cron: '0 21 * * *'
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: install deps
        run: pip install yfinance requests anthropic cryptography

      - name: generate (異常検知＋AI見立て＋暗号化を index.html に埋め込み)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          MARKETZAWA_MASTER_KEY: ${{ secrets.MARKETZAWA_MASTER_KEY }}
        run: python generate.py

      - name: commit & push
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "auto: update index.html" || echo "no change"
          git push
